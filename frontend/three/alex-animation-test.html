<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Alex Animation Test</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202020;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="controls">
    <button id="idleBtn">Idle</button>
    <button id="talkBtn">Talking</button>
</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from 'three';

import {
    FBXLoader
} from 'three/addons/loaders/FBXLoader.js';


// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x202020);


// ========================================
// CAMERA
// ========================================

const camera =
    new THREE.PerspectiveCamera(
        35,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    1.6,
    5
);

camera.lookAt(
    0,
    1.2,
    0
);


// ========================================
// RENDERER
// ========================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(
    renderer.domElement
);


// ========================================
// LIGHTING
// ========================================

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

scene.add(ambientLight);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

keyLight.position.set(
    2,
    5,
    4
);

scene.add(keyLight);


// ========================================
// FBX LOADER
// ========================================

const loader =
    new FBXLoader();


// ========================================
// VARIABLES
// ========================================

let alex = null;

let mixer = null;

let idleAction = null;

let talkingAction = null;

let currentAction = null;


// ========================================
// LOAD ALEX CHARACTER
// ========================================

loader.load(
    './models/alex.fbx',

    (model) => {

        alex = model;

        scene.add(alex);

        alex.scale.setScalar(0.01);

        alex.position.set(
            0,
            0,
            0
        );

        console.log(
            'Alex character loaded'
        );


        // ========================================
        // CREATE ANIMATION MIXER
        // ========================================

        mixer =
            new THREE.AnimationMixer(
                alex
            );


        // ========================================
        // LOAD IDLE ANIMATION
        // ========================================

        loader.load(
            './models/Alex_Idle.fbx',

            (idle) => {

                console.log(
                    'Idle FBX loaded'
                );

                console.log(
                    'Idle animations:',
                    idle.animations.map(
                        animation =>
                            animation.name
                    )
                );


                if (
                    idle.animations.length > 0
                ) {

                    idleAction =
                        mixer.clipAction(
                            idle.animations[0]
                        );

                    console.log(
                        'Idle animation ready'
                    );

                    playAnimation(
                        idleAction
                    );
                }

            },

            undefined,

            (error) => {

                console.error(
                    'Idle animation error:',
                    error
                );

            }
        );


        // ========================================
        // LOAD TALKING ANIMATION
        // ========================================

        loader.load(
            './models/Alex_Talking.fbx',

            (talking) => {

                console.log(
                    'Talking FBX loaded'
                );

                console.log(
                    'Talking animations:',
                    talking.animations.map(
                        animation =>
                            animation.name
                    )
                );


                if (
                    talking.animations.length > 0
                ) {

                    talkingAction =
                        mixer.clipAction(
                            talking.animations[0]
                        );

                    console.log(
                        'Talking animation ready'
                    );

                }

            },

            undefined,

            (error) => {

                console.error(
                    'Talking animation error:',
                    error
                );

            }
        );

    },

    undefined,

    (error) => {

        console.error(
            'Alex character loading error:',
            error
        );

    }
);


// ========================================
// PLAY ANIMATION
// ========================================

function playAnimation(
    newAction
) {

    if (!newAction) {
        return;
    }


    if (
        currentAction &&
        currentAction !== newAction
    ) {

        currentAction.fadeOut(
            0.25
        );

    }


    newAction
        .reset()
        .fadeIn(0.25)
        .play();


    currentAction =
        newAction;

}


// ========================================
// IDLE BUTTON
// ========================================

document
    .getElementById('idleBtn')
    .addEventListener(
        'click',
        () => {

            if (idleAction) {

                playAnimation(
                    idleAction
                );

            }

        }
    );


// ========================================
// TALKING BUTTON
// ========================================

document
    .getElementById('talkBtn')
    .addEventListener(
        'click',
        () => {

            if (talkingAction) {

                playAnimation(
                    talkingAction
                );

            }

        }
    );


// ========================================
// ANIMATION LOOP
// ========================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    if (mixer) {

        mixer.update(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


// ========================================
// RESIZE
// ========================================

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>
